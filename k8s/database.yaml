apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cristal-mysql1-data
  labels:
    app: cristal-mysql1
    dxp.io/managed: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Taille fixe -- voir dxp-gp-template.yaml (limitation connue lot 1a,
      # pas de substitution generique de parametre a ce jour).
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cristal-mysql1
  labels:
    app: cristal-mysql1
    dxp.io/managed: "true"
spec:
  replicas: 1
  # Recreate -- indispensable avec un PVC ReadWriteOnce : un rolling
  # update tenterait de monter le meme volume depuis 2 pods a la fois.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cristal-mysql1
  template:
    metadata:
      labels:
        app: cristal-mysql1
        backstage.io/kubernetes-id: cristal-mysql1
    spec:
      containers:
        - name: cristal-mysql1
          image: harbor.dxp/dxp/cristal-mysql1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          envFrom:
            # Secret cree au provisioning -- lot 1b (service.go), pas
            # encore livre. Voir avertissement dxp-gp-template.yaml.
            - secretRef:
                name: dxp-db-cristal-mysql1
          volumeMounts:
            # subPath pgdata -- evite l'echec "data directory not empty"
            # de Postgres du a lost+found present a la racine d'un volume
            # fraichement monte.
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cristal-mysql1-data
---
apiVersion: v1
kind: Service
metadata:
  name: cristal-mysql1
  labels:
    app: cristal-mysql1
spec:
  selector:
    app: cristal-mysql1
  ports:
    - port: 5432
      targetPort: 5432
